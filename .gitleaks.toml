# gitleaks config: the default rules plus a rule for Solana keypair arrays.
[extend]
useDefault = true

[[rules]]
id = "solana-keypair-array"
description = "A Solana keypair as a JSON array of 64 bytes"
regex = '''\[\s*(?:\d{1,3}\s*,\s*){63}\d{1,3}\s*\]'''
tags = ["key", "solana"]

[allowlist]
description = "Example env file holds placeholders only"
paths = ['''\.env\.example$''']
