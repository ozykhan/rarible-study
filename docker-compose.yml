# Local Postgres with pgvector, matching the Railway pgvector template.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: slabwatch
      POSTGRES_PASSWORD: slabwatch
      POSTGRES_DB: slabwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slabwatch -d slabwatch"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
