name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: slabwatch
          POSTGRES_PASSWORD: slabwatch
          POSTGRES_DB: slabwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slabwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://slabwatch:slabwatch@localhost:5432/slabwatch
      EMBEDDER: hash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Eval runner plumbing check (no model calls)
        run: pnpm eval -- v1 --offline
      - name: Migrate and seed from scratch
        run: pnpm db:migrate && pnpm db:seed
