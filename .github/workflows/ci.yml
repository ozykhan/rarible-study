name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: slabwatch
          POSTGRES_PASSWORD: slabwatch
          POSTGRES_DB: slabwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slabwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # For the test that checks OpenSearch answers market searches as Postgres does.
      opensearch:
        image: opensearchproject/opensearch:3.9.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          cluster.routing.allocation.disk.threshold_enabled: "false"
          OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs localhost:9200/_cluster/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://slabwatch:slabwatch@localhost:5432/slabwatch
      OPENSEARCH_URL: http://localhost:9200
      EMBEDDER: hash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the web app
        run: pnpm --filter @slabwatch/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Eval runner plumbing check (no model calls)
        run: pnpm eval -- v1 --offline
      - name: Migrate and seed from scratch
        run: pnpm db:migrate && pnpm db:seed
