name: ci

on:
  push:
    branches: [main]
  pull_request:

# The workflow token is read-only. Actions are pinned to commit SHAs (the
# comment names the version); Dependabot keeps the pins up to date.
permissions:
  contents: read

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: slabwatch
          POSTGRES_PASSWORD: slabwatch
          POSTGRES_DB: slabwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slabwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://slabwatch:slabwatch@localhost:5432/slabwatch
      EMBEDDER: hash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the web app
        run: pnpm --filter @slabwatch/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Eval runner plumbing check (no model calls)
        run: pnpm eval -- v1 --offline
      - name: Migrate and seed from scratch
        run: pnpm db:migrate && pnpm db:seed
