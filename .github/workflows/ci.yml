name: ci

on:
  push:
    branches: [main]
  pull_request:

# The workflow token is read-only. Actions are pinned to commit SHAs (the
# comment names the version); Dependabot keeps the pins up to date.
permissions:
  contents: read

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: slabwatch
          POSTGRES_PASSWORD: slabwatch
          POSTGRES_DB: slabwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slabwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://slabwatch:slabwatch@localhost:5432/slabwatch
      EMBEDDER: hash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the web app
        run: pnpm --filter @slabwatch/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Eval runner plumbing check (no model calls)
        run: pnpm eval -- v1 --offline
      - name: Migrate and seed from scratch
        run: pnpm db:migrate && pnpm db:seed
