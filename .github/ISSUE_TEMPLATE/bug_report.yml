name: Bug report
description: Something in the code or the live demo does not work as the README describes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This is a personal study project. Bug reports are welcome, but fixes are best effort and outside pull requests are not accepted (see CONTRIBUTING.md).
        For a security problem, do not file an issue: use **Report a vulnerability** on the Security tab.
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - The live demo
        - Running it locally
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the market
        2. Press Buy now on a slab
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or time
      description: The commit you ran locally, or roughly when you saw it on the demo (with time zone).
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Before you submit
      options:
        - label: This report has no private keys, seed phrases, tokens or other secrets in it, screenshots included.
          required: true
